services:
  # ─────────────────────────────────────────────
  #  MySQL 5.7 — database utama SA-MP server
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:5.7
    container_name: ljrp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawa}
      MYSQL_USER: ${MYSQL_USER:-samp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-samppassword}
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"          # buka ke host (untuk HeidiSQL/dev tools)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - samp_net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  #  SA-MP Server — berjalan di atas Linux
  # ─────────────────────────────────────────────
  samp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ljrp-samp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    volumes:
      - samp_logs:/samp/logs
      - samp_scriptfiles:/samp/scriptfiles
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-samp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-samppassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawa}
      TZ: Asia/Jakarta
    networks:
      - samp_net

  # ─────────────────────────────────────────────
  #  Next.js Web Portal & UCP
  # ─────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ljrp-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-samp}
      DB_PASSWORD: ${MYSQL_PASSWORD:-samppassword}
      DB_DATABASE: ${MYSQL_DATABASE:-jawa}
      JWT_SECRET: ${JWT_SECRET:-losjawaroleplaysecretkey123}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      TZ: Asia/Jakarta
    env_file:
      - ./web/.env.local
    networks:
      - samp_net

  # ─────────────────────────────────────────────
  #  HTTP CDN — serve /models untuk download client
  #  ponytail: nginx:alpine, static file serve
  # ─────────────────────────────────────────────
  models-cdn:
    image: nginx:alpine
    container_name: ljrp-models-cdn
    restart: unless-stopped
    ports:
      - "7778:80"
    volumes:
      - ./models:/usr/share/nginx/html:ro
    networks:
      - samp_net

  # ─────────────────────────────────────────────
  #  Playit.gg — Tunneling Khusus Game
  # ─────────────────────────────────────────────
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: ljrp-playit
    restart: unless-stopped
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
    networks:
      - samp_net

volumes:
  mysql_data:
    driver: local
  samp_logs:
    driver: local
  samp_scriptfiles:
    driver: local

networks:
  samp_net:
    driver: bridge

